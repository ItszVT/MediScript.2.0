{% extends "base.html" %}
{% block title %}Create account — MediScript{% endblock %}
{% block header %}
<header class="top"><div class="brand"><a href="/" style="color:inherit;text-decoration:none"><span class="rx">℞</span> MediScript</a></div></header>
{% endblock %}
{% block content %}
<div style="max-width:460px;margin:5vh auto 0">
  <div class="card">
    <p class="eyebrow">Create your account</p>
    <h2 style="margin-top:0">Get started</h2>
    <form id="registerForm">
      <label>Full name</label>
      <input name="full_name" type="text" placeholder="Your name">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@example.com">
      <label>Password</label>
      <input name="password" type="password" required minlength="6" placeholder="At least 6 characters">
      <label>Account type</label>
      <select id="role" name="role">
        <option value="user" {{ 'selected' if role!='chemist' else '' }}>Patient / User</option>
        <option value="chemist" {{ 'selected' if role=='chemist' else '' }}>Pharmacy / Chemist</option>
      </select>
      <div id="pharmacyWrap" style="display:none">
        <label>Pharmacy name</label>
        <input name="pharmacy_name" type="text" placeholder="e.g. City Care Pharmacy">
      </div>
      <button class="btn block" style="margin-top:18px">Create account</button>
    </form>
    <p class="muted center" style="margin-top:16px;font-size:14px">
      Already registered? <a href="/login?role={{ role }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
