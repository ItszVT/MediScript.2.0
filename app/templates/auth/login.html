{% extends "base.html" %}
{% block title %}Sign in — MediScript{% endblock %}
{% block header %}
<header class="top"><div class="brand"><a href="/" style="color:inherit;text-decoration:none"><span class="rx">℞</span> MediScript</a></div></header>
{% endblock %}
{% block content %}
<div style="max-width:420px;margin:6vh auto 0">
  <div class="card">
    <p class="eyebrow">{{ 'Pharmacy portal' if role=='chemist' else 'Patient portal' }}</p>
    <h2 style="margin-top:0">Welcome back</h2>
    <form id="loginForm">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@example.com">
      <label>Password</label>
      <input name="password" type="password" required placeholder="••••••••">
      <button class="btn block" style="margin-top:18px">Sign in</button>
    </form>
    <p class="muted center" style="margin-top:16px;font-size:14px">
      No account? <a href="/register?role={{ role }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
